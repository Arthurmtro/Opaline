name: Opaline
options:
  bundleIdPrefix: app.opaline
  deploymentTarget:
    macOS: "15.0"
  createIntermediateGroups: true
packages:
  OpalineKit:
    path: .
targets:
  Opaline:
    type: application
    platform: macOS
    sources:
      - App/Sources
      - App/Resources
    dependencies:
      - package: OpalineKit
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: app.opaline.Opaline
        PRODUCT_NAME: Opaline
        MARKETING_VERSION: "1.0"
        CURRENT_PROJECT_VERSION: "1"
        SWIFT_VERSION: "6.0"
        GENERATE_INFOPLIST_FILE: YES
        INFOPLIST_KEY_CFBundleDisplayName: Opaline
        INFOPLIST_KEY_LSApplicationCategoryType: public.app-category.developer-tools
        INFOPLIST_KEY_NSHumanReadableCopyright: "© Opaline contributors, MIT License"
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        # Writes dotfiles across the home folder and quits other apps: no sandbox.
        ENABLE_APP_SANDBOX: NO
        ENABLE_HARDENED_RUNTIME: YES
        CODE_SIGN_IDENTITY: "-"
        CODE_SIGN_STYLE: Manual
        DEVELOPMENT_TEAM: ""
