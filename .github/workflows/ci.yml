name: CI

on:
  push:
    branches: [main]
  pull_request:

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4
      - name: Engine tests
        run: swift test
      - name: Build the app
        run: |
          brew install xcodegen
          xcodegen generate --quiet
          xcodebuild -project Opaline.xcodeproj -scheme Opaline -configuration Debug -derivedDataPath .build/xcode build
